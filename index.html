<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <header></header>
    <main>
        <section id="2"></section>
        <section id="3" class="mt-2 w-full flex flex-col items-center lg:grid lg:grid-cols-3 lg:justify-items-stretch">
    
            <!-- Linha do H2: No desktop, ocupa a primeira coluna do grid e alinha o texto perfeitamente à esquerda da primeira foto -->
            <div class="w-full flex justify-center lg:justify-start lg:col-span-3 px-4 lg:px-12">
                <h2 class="text-[20px] font-bold mt-6 mb-4 lg:mb-6">New Arrivals</h2>
            </div>
        
            <!-- Card 1 (Agora com comportamento flexível idêntico aos outros) -->
            <div class="mb-16 lg:mb-24 size-100 xl-size150 w-full flex flex-col items-center px-4 lg:px-12">
                <a href="#" class="block w-full">
                    <img class="rounded-2xl mt-1 mb-1 w-full aspect-3/4 object-cover object-bottom-right" src="./assets/sc3image1.png" alt="">
                    <div class="flex justify-between items-center px-4">
                        <div>
                            <h3 class="text-[16px] font-bold">Hoodies & Sweetshirt</h3>
                            <p>Explore Now!</p>
                        </div>
                        <div>
                            <img src="./assets/sc3arrow1.png" alt="">
                        </div>
                    </div>
                </a>
            </div>
        
            <!-- Card 2 -->
            <div class="mb-16 lg:mb-24 size-100 w-full flex flex-col items-center px-4 lg:px-12">
                <a href="#" class="block w-full">
                    <img class="rounded-2xl mt-1 mb-1 w-full aspect-3/4 object-cover object-[25%_75%]" src="./assets/sc3image2.png" alt="">
                    <div class="flex justify-between items-center px-4">
                        <div>
                            <h3 class="text-[16px] font-bold">Coats & Parkas</h3>
                            <p>Explore Now!</p>
                        </div>
                        <div>
                            <img src="./assets/sc3arrow1.png" alt="">
                        </div>
                    </div>
                </a>
            </div>
        
            <!-- Card 3 -->
            <div class="mb-16 lg:mb-24 size-100 w-full flex flex-col items-center px-4 lg:px-12">
                <a href="#" class="block w-full">
                    <img class="rounded-2xl mt-1 mb-1 w-full aspect-3/4 object-cover object-center" src="./assets/sc3image3.png" alt="">
                    <div class="flex justify-between items-center px-4">
                        <div>
                            <h3 class="text-[16px] font-bold">Coats & Parkas</h3>
                            <p>Explore Now!</p>
                        </div>
                        <div>
                            <img src="./assets/sc3arrow1.png" alt="">
                        </div>
                    </div>
                </a>
            </div>
        
        </section>
      
 
        <section id="4" class="lg:pl-3 lg:pr-3 xl:pl-6 xl:pr-6 2xl:pl-12 2xl:pr-12 "></section>
        <section id="5"></section>
        <section id="6"></section>
    </main>
    <footer></footer>
    
</body>
</html>
